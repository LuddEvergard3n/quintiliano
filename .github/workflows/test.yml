name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

# Cancela runs anteriores do mesmo branch/PR para evitar deploys sobrepostos
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Testes (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: ["22.x"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Rodar testes
        run: npm test

  deploy:
    name: Deploy — GitHub Pages
    needs: test
    runs-on: ubuntu-latest
    # Só executa em push para main/master — não em pull requests
    if: github.event_name == 'push'

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar .nojekyll
        run: |
          if [ ! -f .nojekyll ]; then
            echo "ERRO: .nojekyll ausente — GitHub Pages vai processar o projeto como Jekyll" >&2
            exit 1
          fi
          echo ".nojekyll presente: OK"

      - name: Preparar artefato de deploy
        run: |
          # Cria diretório de deploy apenas com arquivos do browser
          mkdir -p _site
          cp .nojekyll _site/
          cp index.html _site/
          cp -r css _site/css
          cp -r js _site/js
          cp -r modules _site/modules
          cp -r components _site/components
          cp -r data _site/data
          echo "Conteúdo do artefato:"
          find _site -type f | sort

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy para GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
